<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#dc2626" />
    <meta name="description" content="AI-Powered Emergency Ambulance Discovery Platform. Find and connect with nearby verified ambulances within seconds during medical emergencies." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/ambulance-icon.svg" />
    <title>Ambulance Tracker - AI Emergency Ambulance Discovery</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('PWA ServiceWorker registered with scope:', reg.scope))
            .catch(err => console.log('PWA ServiceWorker registration skipped/failed:', err));
        });
      }
    </script>
  </body>
</html>
